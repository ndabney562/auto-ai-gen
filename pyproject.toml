[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-ai-gen"
version = "0.1.0"
description = "Durable control plane for autonomous multi-model AI engineering agents"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
